name: tiktok_clone
description: A modern TikTok clone built with Flutter
version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0

  # HTTP & Networking
  dio: ^5.3.0

  # Local Storage
  shared_preferences: ^2.2.0

  # Security (secure token storage - Keychain/Keystore backed)
  flutter_secure_storage: ^9.0.0

  # Video & Media (Module 3: video feed playback; Module 4: upload picker)
  video_player: ^2.7.0
  cached_network_image: ^3.3.0
  image_picker: ^1.0.0

  # Navigation
  go_router: ^12.0.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^3.0.0

  # Testing
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
