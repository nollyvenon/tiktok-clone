name: tiktok_clone
description: A modern TikTok clone built with Flutter
version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  riverpod_generator: ^2.3.0

  # HTTP & Networking
  dio: ^5.3.0
  http: ^1.1.0

  # Local Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0

  # Security
  flutter_secure_storage: ^9.0.0

  # Video & Media
  video_player: ^2.7.0
  image_picker: ^1.0.0
  video_compress: ^3.1.2
  cached_network_image: ^3.3.0

  # UI Components
  flutter_svg: ^2.0.0
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0
  infinite_scroll_pagination: ^4.0.0

  # Date & Time
  intl: ^0.19.0
  timeago: ^3.4.0

  # Navigation
  go_router: ^12.0.0

  # Bottom Sheet
  modal_bottom_sheet: ^2.1.1

  # Icons
  font_awesome_flutter: ^10.7.0

  # WebSocket (Real-time)
  web_socket_channel: ^2.4.0

  # Form Validation
  formz: ^0.6.0

  # Analytics
  firebase_analytics: ^10.7.0
  firebase_core: ^24.2.0

  # Monitoring
  sentry_flutter: ^7.17.0

  # Permissions
  permission_handler: ^11.4.3

  # Device Info
  device_info_plus: ^10.0.0
  connectivity_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^3.0.0
  analysis_options: ^5.1.0

  # Code Generation
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

  # Testing
  mockito: ^5.4.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # Fonts
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/geist-regular.ttf
        - asset: assets/fonts/geist-bold.ttf
          weight: 700

  # Native code (if needed)
  # plugin:
  #   platforms:
  #     android:
  #       package: com.tiktok.clone
  #       pluginClass: TikTokClonePlugin
  #     ios:
  #       pluginClass: TikTokClonePlugin
